name: Windows baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm.cmd install --global npm@11.12.1
      - run: npm.cmd ci
      - run: npm.cmd run setup:electron
      - run: npm.cmd test
      - run: npm.cmd run build
      - run: npm.cmd run notices
      - run: npm.cmd run smoke:desktop
      - run: node tests/mcp-ui-smoke.cjs
      - run: npm.cmd audit --omit=dev --audit-level=high
